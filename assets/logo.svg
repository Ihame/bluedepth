<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <!-- Circle with diver icon -->
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BC0EB"/>
      <stop offset="100%" style="stop-color:#001F4D"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1)"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="30" cy="30" r="28" fill="url(#circleGrad)"/>
  <!-- Wave inside circle -->
  <path d="M2,30 Q10,22 18,28 Q26,34 30,28 Q34,22 38,28 Q46,34 58,28" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none" clip-path="url(#circleClip)"/>
  <clipPath id="circleClip"><circle cx="30" cy="30" r="27"/></clipPath>
  <!-- Diver silhouette (simplified) -->
  <g transform="translate(30,30) rotate(-30)" fill="rgba(0,10,40,0.85)">
    <!-- Head -->
    <circle cx="0" cy="-10" r="4"/>
    <!-- Body -->
    <rect x="-3" y="-6" width="6" height="10" rx="2"/>
    <!-- Tank -->
    <rect x="3" y="-5" width="3" height="8" rx="1.5"/>
    <!-- Legs -->
    <rect x="-4" y="3" width="3" height="8" rx="1.5" transform="rotate(-10,-2,7)"/>
    <rect x="1" y="3" width="3" height="8" rx="1.5" transform="rotate(10,2,7)"/>
    <!-- Fins -->
    <ellipse cx="-3" cy="11" rx="5" ry="2" transform="rotate(-10)"/>
    <ellipse cx="3" cy="11" rx="5" ry="2" transform="rotate(10)"/>
    <!-- Arms -->
    <rect x="-8" y="-4" width="6" height="2.5" rx="1.2" transform="rotate(-20,-5,-3)"/>
    <rect x="3" y="-4" width="5" height="2.5" rx="1.2" transform="rotate(20,5,-3)"/>
  </g>
  <!-- Bubbles -->
  <circle cx="22" cy="14" r="1.5" fill="rgba(255,255,255,0.7)"/>
  <circle cx="26" cy="10" r="1" fill="rgba(255,255,255,0.5)"/>
  <circle cx="20" cy="10" r="0.8" fill="rgba(255,255,255,0.4)"/>

  <!-- Text: Blue -->
  <text x="68" y="26" font-family="Montserrat,Arial,sans-serif" font-weight="800" font-size="22" fill="#5BC0EB">Blue</text>
  <!-- Text: Depth -->
  <text x="108" y="26" font-family="Montserrat,Arial,sans-serif" font-weight="800" font-size="22" fill="white">Depth</text>
  <!-- Sub text -->
  <text x="68" y="42" font-family="Montserrat,Arial,sans-serif" font-weight="500" font-size="9" fill="rgba(255,255,255,0.65)" letter-spacing="3">MARINE GROUP</text>
  <!-- Decorative lines around sub text -->
  <line x1="62" y1="38" x2="66" y2="38" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
  <line x1="172" y1="38" x2="176" y2="38" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
</svg>
